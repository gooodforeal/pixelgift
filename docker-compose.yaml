services:
  db:
    image: postgres:16-alpine
    env_file:
      - ./docker/db/.env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pixelgift"]
      interval: 2s
      timeout: 5s
      retries: 30

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    env_file:
      - ./docker/minio/.env
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    env_file:
      - ./docker/app/.env
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  front:
    build:
      context: .
      dockerfile: docker/front/Dockerfile
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://127.0.0.1/healthz",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  nginx:
    build:
      context: ./docker/nginx
    ports:
      - "8080:80"
    env_file:
      - ./docker/nginx/.env
    depends_on:
      app:
        condition: service_healthy
      front:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: docker/bot/Dockerfile
    env_file:
      - ./docker/bot/.env
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

  taskiq_worker:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    command:
      [
        "taskiq",
        "worker",
        "app.infrastructure.worker.app:broker",
      ]
    env_file:
      - ./docker/app/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped

  taskiq_scheduler:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    command:
      [
        "taskiq",
        "scheduler",
        "app.infrastructure.worker.app:scheduler",
      ]
    env_file:
      - ./docker/app/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
