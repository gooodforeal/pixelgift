[project]
name = "pixelgift"
version = "0.1.0"
description = "Digital gift boxes: editor, public delivery, commerce, Telegram auth"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aioboto3>=15.5.0",
    "aiogram>=3.30.0",
    "aiosmtplib>=5.1.3",
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "babel>=2.18.0",
    "email-validator>=2.3.0",
    "fastapi>=0.140.7",
    "greenlet>=3.5.4",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "openai>=2.0.0",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.32",
    "qrcode[pil]>=8.2",
    "reportlab>=5.0.1",
    "sqladmin>=0.32.0",
    "sqlalchemy>=2.0.51",
    "taskiq>=0.12.6",
    "taskiq-redis>=1.2.3",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.25.0",
    "mkdocs-material>=9.0.0",
    "mkdocstrings[python]>=0.29.0",
    "mkdocs-gen-files>=0.5.0",
    "mkdocs-literate-nav>=0.6.0",
    "mkdocs-section-index>=0.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
